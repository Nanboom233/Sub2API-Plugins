name: Sub2API Plugins release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delivery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Prepare Corepack
        run: npm install --global corepack
      - name: Build and test the combined installer
        run: python3 scripts/build.py
      - uses: actions/upload-artifact@v6
        with:
          name: sub2api-plugins
          path: |
            dist/build/sub2api-plugins
            dist/build/sub2api-plugins-installer

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: delivery
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: sub2api-plugins
          path: artifacts
      - name: Publish the installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/sub2api-plugins-installer --repo "$GITHUB_REPOSITORY" --generate-notes
