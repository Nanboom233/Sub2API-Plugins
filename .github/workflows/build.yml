name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Upstream Sub2API version tag
        required: true
        default: v0.2.19
        type: string
      linux_amd64:
        description: Build Linux x86_64
        type: boolean
        default: true
      linux_arm64:
        description: Build Linux ARM64
        type: boolean
        default: true
      darwin_amd64:
        description: Build macOS Intel
        type: boolean
        default: true
      darwin_arm64:
        description: Build macOS Apple Silicon
        type: boolean
        default: true
      windows_amd64:
        description: Build Windows x86_64
        type: boolean
        default: true
      release:
        description: Publish a GitHub Release
        type: boolean
        default: false
      release_tag:
        description: Plugin Release tag, required when publication is enabled
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: "1"
  SUB2API_BUILD_WORKSPACE: ${{ github.workspace }}/dist/work
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  COREPACK_ENABLE_AUTO_PIN: "0"
  COREPACK_ENABLE_PROJECT_SPEC: "0"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      platforms: ${{ steps.source.outputs.platforms }}
      server_count: ${{ steps.source.outputs.server_count }}
      server_matrix: ${{ steps.source.outputs.server_matrix }}
      installer_matrix: ${{ steps.source.outputs.installer_matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.0"
      - name: Prepare Corepack
        run: |
          npm install --global corepack@0.36.0
          corepack enable
      - name: Download and patch source
        id: source
        env:
          SUB2API_BUILD_STAGE: source
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          LINUX_AMD64: ${{ github.event_name != 'workflow_dispatch' || inputs.linux_amd64 }}
          LINUX_ARM64: ${{ github.event_name != 'workflow_dispatch' || inputs.linux_arm64 }}
          DARWIN_AMD64: ${{ github.event_name != 'workflow_dispatch' || inputs.darwin_amd64 }}
          DARWIN_ARM64: ${{ github.event_name != 'workflow_dispatch' || inputs.darwin_arm64 }}
          WINDOWS_AMD64: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_amd64 }}
          RELEASE_ENABLED: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release) }}
          RELEASE_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        run: |
          set -o pipefail
          if [[ "$RELEASE_ENABLED" == true && -z "$RELEASE_TAG" ]]; then
            echo "::error::A Release tag is required when publication is enabled."
            exit 1
          fi
          platforms=()
          if [[ "$LINUX_AMD64" == true ]]; then platforms+=(linux-amd64); fi
          if [[ "$LINUX_ARM64" == true ]]; then platforms+=(linux-arm64); fi
          if [[ "$DARWIN_AMD64" == true ]]; then platforms+=(darwin-amd64); fi
          if [[ "$DARWIN_ARM64" == true ]]; then platforms+=(darwin-arm64); fi
          if [[ "$WINDOWS_AMD64" == true ]]; then platforms+=(windows-amd64); fi
          export SUB2API_BUILD_PLATFORMS="${platforms[*]}"
          mkdir -p dist
          python3 scripts/build.py 2>&1 | tee dist/build-prepare.log
          source_sha="$(git rev-parse HEAD)"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
      - name: Locate dependency caches
        id: paths
        env:
          PNPM: ${{ steps.source.outputs.pnpm }}
        run: |
          modules="$(go env GOMODCACHE)"
          build_cache="$(go env GOCACHE)"
          go_version="$(go env GOVERSION)"
          node_version="$(node -p 'process.versions.node')"
          pnpm_store="$(corepack "$PNPM" store path --silent)"
          printf 'modules=%s\nbuild=%s\ngo=%s\nnode=%s\npnpm=%s\n' "$modules" "$build_cache" "$go_version" "$node_version" "$pnpm_store" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6.1.0
        id: modules
        with:
          path: ${{ steps.paths.outputs.modules }}
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.go }}-${{ hashFiles('dist/work/source/backend/go.sum', 'scripts/build.py') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.go }}-
      - uses: actions/cache/restore@v6.1.0
        id: go_build
        with:
          path: ${{ steps.paths.outputs.build }}
          key: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.go }}-linux-amd64-prepare-${{ hashFiles('dist/work/source/backend/go.sum', 'scripts/build.py') }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.go }}-linux-amd64-prepare-${{ hashFiles('dist/work/source/backend/go.sum', 'scripts/build.py') }}-
      - uses: actions/cache/restore@v6.1.0
        id: pnpm
        with:
          path: ${{ steps.paths.outputs.pnpm }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.node }}-${{ steps.source.outputs.pnpm }}-${{ hashFiles('dist/work/source/frontend/pnpm-lock.yaml', 'scripts/build.py') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.node }}-${{ steps.source.outputs.pnpm }}-
      - name: Prepare and test
        id: prepare
        env:
          SUB2API_BUILD_STAGE: prepare
          UPSTREAM_TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -o pipefail
          python3 scripts/build.py 2>&1 | tee -a dist/build-prepare.log
      - uses: actions/cache/save@v6.1.0
        if: ${{ steps.modules.outputs.cache-hit != 'true' }}
        with:
          path: ${{ steps.paths.outputs.modules }}
          key: ${{ steps.modules.outputs.cache-primary-key }}
      - uses: actions/cache/save@v6.1.0
        if: ${{ steps.go_build.outputs.cache-hit != 'true' }}
        with:
          path: ${{ steps.paths.outputs.build }}
          key: ${{ steps.go_build.outputs.cache-primary-key }}
      - uses: actions/cache/save@v6.1.0
        if: ${{ steps.pnpm.outputs.cache-hit != 'true' }}
        with:
          path: ${{ steps.paths.outputs.pnpm }}
          key: ${{ steps.pnpm.outputs.cache-primary-key }}
      - name: Upload prepared source and installer
        uses: actions/upload-artifact@v7.0.2
        with:
          name: internal-prepared
          path: |
            dist/work/source/backend
            dist/work/installer
            !dist/work/installer/payloads/**
          if-no-files-found: error
      - name: Upload prepared Linux amd64 server
        uses: actions/upload-artifact@v7.0.2
        with:
          name: internal-server-linux-amd64
          path: dist/work/binaries/sub2api-plugins-${{ steps.source.outputs.tag }}-linux-amd64
          if-no-files-found: error
      - name: Upload failure log
        id: diagnostics
        if: ${{ failure() && !cancelled() && (steps.source.outcome == 'failure' || steps.prepare.outcome == 'failure') }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-log-prepare
          path: dist/build-prepare.log
          if-no-files-found: ignore
      - name: Report result
        if: ${{ always() && !cancelled() }}
        env:
          STATUS: ${{ job.status }}
          DIAGNOSTIC_URL: ${{ steps.diagnostics.outputs.artifact-url }}
        run: |
          printf 'Prepare: %s\n' "$STATUS" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$DIAGNOSTIC_URL" ]]; then
            printf 'Diagnostics: [build log](%s)\n' "$DIAGNOSTIC_URL" >> "$GITHUB_STEP_SUMMARY"
          fi

  server:
    needs: prepare
    if: ${{ needs.prepare.outputs.server_count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.server_matrix) }}
    env:
      UPSTREAM_TAG: ${{ needs.prepare.outputs.tag }}
      SUB2API_BUILD_STAGE: server
      SUB2API_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: internal-prepared
          path: dist/work
      - name: Locate Go caches
        id: paths
        run: |
          modules="$(go env GOMODCACHE)"
          build_cache="$(go env GOCACHE)"
          go_version="$(go env GOVERSION)"
          printf 'modules=%s\nbuild=%s\ngo=%s\n' "$modules" "$build_cache" "$go_version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6.1.0
        id: modules
        with:
          path: ${{ steps.paths.outputs.modules }}
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.go }}-${{ hashFiles('dist/work/source/backend/go.sum', 'scripts/build.py') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.go }}-
      - uses: actions/cache/restore@v6.1.0
        id: go_build
        with:
          path: ${{ steps.paths.outputs.build }}
          key: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.go }}-${{ matrix.target }}-server-${{ hashFiles('dist/work/source/backend/go.sum', 'scripts/build.py') }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.go }}-${{ matrix.target }}-server-${{ hashFiles('dist/work/source/backend/go.sum', 'scripts/build.py') }}-
            gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.go }}-linux-amd64-prepare-${{ hashFiles('dist/work/source/backend/go.sum', 'scripts/build.py') }}-
      - name: Compile server
        id: compile
        run: |
          set -o pipefail
          python3 scripts/build.py 2>&1 | tee "dist/build-server-$SUB2API_BUILD_TARGET.log"
      - uses: actions/cache/save@v6.1.0
        if: ${{ steps.go_build.outputs.cache-hit != 'true' }}
        with:
          path: ${{ steps.paths.outputs.build }}
          key: ${{ steps.go_build.outputs.cache-primary-key }}
      - name: Upload server handoff
        uses: actions/upload-artifact@v7.0.2
        with:
          name: internal-server-${{ matrix.target }}
          path: dist/work/binaries/*
          if-no-files-found: error
      - name: Upload failure log
        id: diagnostics
        if: ${{ failure() && !cancelled() && (steps.compile.outcome == 'failure') }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-log-server-${{ matrix.target }}
          path: dist/build-server-${{ matrix.target }}.log
          if-no-files-found: ignore
      - name: Report result
        if: ${{ always() && !cancelled() }}
        env:
          STATUS: ${{ job.status }}
          DIAGNOSTIC_URL: ${{ steps.diagnostics.outputs.artifact-url }}
        run: |
          printf 'Server: %s\n' "$STATUS" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$DIAGNOSTIC_URL" ]]; then
            printf 'Diagnostics: [build log](%s)\n' "$DIAGNOSTIC_URL" >> "$GITHUB_STEP_SUMMARY"
          fi

  installer:
    needs: [prepare, server]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && ((needs.prepare.outputs.server_count == '0' && needs.server.result == 'skipped') || needs.server.result == 'success') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.installer_matrix) }}
    env:
      UPSTREAM_TAG: ${{ needs.prepare.outputs.tag }}
      SUB2API_BUILD_STAGE: installer
      SUB2API_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: internal-prepared
          path: dist/work
      - name: Download native server
        uses: actions/download-artifact@v8.0.2
        with:
          name: internal-server-${{ matrix.target }}
          path: dist/work/binaries
      - name: Download Linux container server
        if: ${{ matrix.target != matrix.linux }}
        uses: actions/download-artifact@v8.0.2
        with:
          name: internal-server-${{ matrix.linux }}
          path: dist/work/binaries
      - name: Locate Go caches
        id: paths
        run: |
          modules="$(go env GOMODCACHE)"
          build_cache="$(go env GOCACHE)"
          go_version="$(go env GOVERSION)"
          printf 'modules=%s\nbuild=%s\ngo=%s\n' "$modules" "$build_cache" "$go_version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6.1.0
        id: modules
        with:
          path: ${{ steps.paths.outputs.modules }}
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.go }}-${{ hashFiles('dist/work/source/backend/go.sum', 'scripts/build.py') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.go }}-
      - uses: actions/cache/restore@v6.1.0
        id: go_build
        with:
          path: ${{ steps.paths.outputs.build }}
          key: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.go }}-${{ matrix.target }}-installer-${{ hashFiles('dist/work/source/backend/go.sum', 'dist/work/installer/go.sum', 'scripts/build.py') }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.go }}-${{ matrix.target }}-installer-${{ hashFiles('dist/work/source/backend/go.sum', 'dist/work/installer/go.sum', 'scripts/build.py') }}-
            gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.go }}-${{ matrix.target }}-server-${{ hashFiles('dist/work/source/backend/go.sum', 'scripts/build.py') }}-
            gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.go }}-linux-amd64-prepare-${{ hashFiles('dist/work/source/backend/go.sum', 'scripts/build.py') }}-
      - name: Compile installer
        id: compile
        run: |
          set -o pipefail
          python3 scripts/build.py 2>&1 | tee "dist/build-installer-$SUB2API_BUILD_TARGET.log"
      - uses: actions/cache/save@v6.1.0
        if: ${{ steps.go_build.outputs.cache-hit != 'true' }}
        with:
          path: ${{ steps.paths.outputs.build }}
          key: ${{ steps.go_build.outputs.cache-primary-key }}
      - name: Upload installer handoff
        uses: actions/upload-artifact@v7.0.2
        with:
          name: internal-installer-${{ matrix.target }}
          path: dist/work/installers/*
          if-no-files-found: error
      - name: Upload failure log
        id: diagnostics
        if: ${{ failure() && !cancelled() && (steps.compile.outcome == 'failure') }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-log-installer-${{ matrix.target }}
          path: dist/build-installer-${{ matrix.target }}.log
          if-no-files-found: ignore
      - name: Report result
        if: ${{ always() && !cancelled() }}
        env:
          STATUS: ${{ job.status }}
          DIAGNOSTIC_URL: ${{ steps.diagnostics.outputs.artifact-url }}
        run: |
          printf 'Installer: %s\n' "$STATUS" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$DIAGNOSTIC_URL" ]]; then
            printf 'Diagnostics: [build log](%s)\n' "$DIAGNOSTIC_URL" >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    needs: [prepare, server, installer]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && ((needs.prepare.outputs.server_count == '0' && needs.server.result == 'skipped') || needs.server.result == 'success') && needs.installer.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      UPSTREAM_TAG: ${{ needs.prepare.outputs.tag }}
      SUB2API_BUILD_STAGE: publish
      SUB2API_BUILD_PLATFORMS: ${{ needs.prepare.outputs.platforms }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: internal-server-*
          merge-multiple: true
          path: dist/work/binaries
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: internal-installer-*
          merge-multiple: true
          path: dist/work/installers
      - name: Publish selected products
        run: python3 scripts/build.py
      - name: Upload linux-amd64 server
        if: ${{ contains(needs.prepare.outputs.platforms, 'linux-amd64') }}
        uses: actions/upload-artifact@v7.0.2
        with:
          path: dist/build/linux-amd64/sub2api-plugins-${{ needs.prepare.outputs.tag }}-linux-amd64
          archive: false
          if-no-files-found: error
      - name: Upload linux-amd64 installer
        if: ${{ contains(needs.prepare.outputs.platforms, 'linux-amd64') }}
        uses: actions/upload-artifact@v7.0.2
        with:
          path: dist/build/linux-amd64/sub2api-plugins-installer-${{ needs.prepare.outputs.tag }}-linux-amd64
          archive: false
          if-no-files-found: error
      - name: Upload linux-arm64 server
        if: ${{ contains(needs.prepare.outputs.platforms, 'linux-arm64') }}
        uses: actions/upload-artifact@v7.0.2
        with:
          path: dist/build/linux-arm64/sub2api-plugins-${{ needs.prepare.outputs.tag }}-linux-arm64
          archive: false
          if-no-files-found: error
      - name: Upload linux-arm64 installer
        if: ${{ contains(needs.prepare.outputs.platforms, 'linux-arm64') }}
        uses: actions/upload-artifact@v7.0.2
        with:
          path: dist/build/linux-arm64/sub2api-plugins-installer-${{ needs.prepare.outputs.tag }}-linux-arm64
          archive: false
          if-no-files-found: error
      - name: Upload darwin-amd64 server
        if: ${{ contains(needs.prepare.outputs.platforms, 'darwin-amd64') }}
        uses: actions/upload-artifact@v7.0.2
        with:
          path: dist/build/darwin-amd64/sub2api-plugins-${{ needs.prepare.outputs.tag }}-darwin-amd64
          archive: false
          if-no-files-found: error
      - name: Upload darwin-amd64 installer
        if: ${{ contains(needs.prepare.outputs.platforms, 'darwin-amd64') }}
        uses: actions/upload-artifact@v7.0.2
        with:
          path: dist/build/darwin-amd64/sub2api-plugins-installer-${{ needs.prepare.outputs.tag }}-darwin-amd64
          archive: false
          if-no-files-found: error
      - name: Upload darwin-arm64 server
        if: ${{ contains(needs.prepare.outputs.platforms, 'darwin-arm64') }}
        uses: actions/upload-artifact@v7.0.2
        with:
          path: dist/build/darwin-arm64/sub2api-plugins-${{ needs.prepare.outputs.tag }}-darwin-arm64
          archive: false
          if-no-files-found: error
      - name: Upload darwin-arm64 installer
        if: ${{ contains(needs.prepare.outputs.platforms, 'darwin-arm64') }}
        uses: actions/upload-artifact@v7.0.2
        with:
          path: dist/build/darwin-arm64/sub2api-plugins-installer-${{ needs.prepare.outputs.tag }}-darwin-arm64
          archive: false
          if-no-files-found: error
      - name: Upload windows-amd64 server
        if: ${{ contains(needs.prepare.outputs.platforms, 'windows-amd64') }}
        uses: actions/upload-artifact@v7.0.2
        with:
          path: dist/build/windows-amd64/sub2api-plugins-${{ needs.prepare.outputs.tag }}-windows-amd64.exe
          archive: false
          if-no-files-found: error
      - name: Upload windows-amd64 installer
        if: ${{ contains(needs.prepare.outputs.platforms, 'windows-amd64') }}
        uses: actions/upload-artifact@v7.0.2
        with:
          path: dist/build/windows-amd64/sub2api-plugins-installer-${{ needs.prepare.outputs.tag }}-windows-amd64.exe
          archive: false
          if-no-files-found: error
      - name: Report result
        if: ${{ always() && !cancelled() }}
        env:
          STATUS: ${{ job.status }}
        run: |
          printf 'Products: %s\n' "$STATUS" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [prepare, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      UPSTREAM_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: sub2api-plugins-*
          merge-multiple: true
          path: dist/release
      - name: Create Release
        run: |
          export RELEASE_REF="refs/tags/$RELEASE_TAG"
          encoded_tag="$(jq -rn --arg tag "$RELEASE_TAG" '$tag | @uri')"
          reference="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$encoded_tag" --jq '.[] | select(.ref == env.RELEASE_REF) | [.object.type, .object.sha] | @tsv')"
          if [[ -n "$reference" ]]; then
            read -r type commit <<< "$reference"
            while [[ "$type" == tag ]]; do
              reference="$(gh api "repos/$GH_REPO/git/tags/$commit" --jq '[.object.type, .object.sha] | @tsv')"
              read -r type commit <<< "$reference"
            done
            if [[ "$type" != commit || "$commit" != "$SOURCE_SHA" ]]; then
              echo "::error::The Release tag does not identify the built source commit."
              exit 1
            fi
          fi
          gh release create "$RELEASE_TAG" dist/release/sub2api-plugins-* \
            --target "$SOURCE_SHA" \
            --title "Sub2API-Plugin ${SOURCE_SHA:0:7} (v${UPSTREAM_TAG#v})" \
            --generate-notes
      - name: Report result
        if: ${{ always() && !cancelled() }}
        env:
          STATUS: ${{ job.status }}
        run: |
          printf 'Release: %s\n' "$STATUS" >> "$GITHUB_STEP_SUMMARY"
