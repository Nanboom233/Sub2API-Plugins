name: Build
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Build {0} · {1}', inputs.upstream_tag, github.ref_name) || github.event.pull_request.title }}

on:
  pull_request:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Upstream Sub2API version tag
        required: true
        default: v0.2.19
        type: string
      linux_amd64:
        description: Build Linux x86_64
        type: boolean
        default: true
      linux_arm64:
        description: Build Linux ARM64
        type: boolean
        default: true
      darwin_amd64:
        description: Build macOS Intel
        type: boolean
        default: true
      darwin_arm64:
        description: Build macOS Apple Silicon
        type: boolean
        default: true
      windows_amd64:
        description: Build Windows x86_64
        type: boolean
        default: true
      release:
        description: Publish a GitHub Release
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: "1"
  SUB2API_BUILD_WORKSPACE: ${{ github.workspace }}/dist/work
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  COREPACK_ENABLE_AUTO_PIN: "0"
  COREPACK_ENABLE_PROJECT_SPEC: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.0"
      - name: Prepare Corepack
        run: |
          npm install --global corepack@0.36.0
          corepack enable
      - name: Download and patch source
        id: source
        env:
          SUB2API_BUILD_STAGE: source
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          LINUX_AMD64: ${{ github.event_name != 'workflow_dispatch' || inputs.linux_amd64 }}
          LINUX_ARM64: ${{ github.event_name != 'workflow_dispatch' || inputs.linux_arm64 }}
          DARWIN_AMD64: ${{ github.event_name != 'workflow_dispatch' || inputs.darwin_amd64 }}
          DARWIN_ARM64: ${{ github.event_name != 'workflow_dispatch' || inputs.darwin_arm64 }}
          WINDOWS_AMD64: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_amd64 }}
        run: |
          platforms=()
          if [[ "$LINUX_AMD64" == true ]]; then platforms+=(linux-amd64); fi
          if [[ "$LINUX_ARM64" == true ]]; then platforms+=(linux-arm64); fi
          if [[ "$DARWIN_AMD64" == true ]]; then platforms+=(darwin-amd64); fi
          if [[ "$DARWIN_ARM64" == true ]]; then platforms+=(darwin-arm64); fi
          if [[ "$WINDOWS_AMD64" == true ]]; then platforms+=(windows-amd64); fi
          export SUB2API_BUILD_PLATFORMS="${platforms[*]}"
          python3 scripts/build.py
          source_sha="$(git rev-parse HEAD)"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
      - name: Locate dependency caches
        id: paths
        env:
          PNPM: ${{ steps.source.outputs.pnpm }}
        run: |
          modules="$(go env GOMODCACHE)"
          build_cache="$(go env GOCACHE)"
          go_version="$(go env GOVERSION)"
          node_version="$(node -p 'process.versions.node')"
          pnpm_store="$(corepack "$PNPM" store path --silent)"
          printf 'modules=%s\nbuild=%s\ngo=%s\nnode=%s\npnpm=%s\n' "$modules" "$build_cache" "$go_version" "$node_version" "$pnpm_store" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6.1.0
        id: modules
        with:
          path: ${{ steps.paths.outputs.modules }}
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.go }}-${{ hashFiles('dist/work/source/backend/go.sum', 'scripts/build.py') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.go }}-
      - uses: actions/cache/restore@v6.1.0
        id: go_build
        with:
          path: ${{ steps.paths.outputs.build }}
          key: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.go }}-${{ hashFiles('dist/work/source/backend/go.sum', 'scripts/build.py') }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.go }}-${{ hashFiles('dist/work/source/backend/go.sum', 'scripts/build.py') }}-
      - uses: actions/cache/restore@v6.1.0
        id: pnpm
        with:
          path: ${{ steps.paths.outputs.pnpm }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.node }}-${{ steps.source.outputs.pnpm }}-${{ hashFiles('dist/work/source/frontend/pnpm-lock.yaml', 'scripts/build.py') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.node }}-${{ steps.source.outputs.pnpm }}-
      - name: Test and build selected platforms
        env:
          SUB2API_BUILD_STAGE: resume
          UPSTREAM_TAG: ${{ steps.source.outputs.tag }}
          SUB2API_BUILD_PLATFORMS: ${{ steps.source.outputs.platforms }}
        run: python3 scripts/build.py
      - name: Upload artifacts
        uses: actions/github-script@v9.0.0
        env:
          UPSTREAM_TAG: ${{ steps.source.outputs.tag }}
          SUB2API_BUILD_PLATFORMS: ${{ steps.source.outputs.platforms }}
        with:
          script: |
            const {mkdtemp} = require('node:fs/promises');
            const path = require('node:path');
            const {pathToFileURL} = require('node:url');
            const sdkDirectory = await mkdtemp(path.join(process.env.RUNNER_TEMP, 'artifact-sdk-'));
            await exec.exec('npm', [
              'install', '--prefix', sdkDirectory, '--no-audit', '--no-fund',
              '--package-lock=false', '@actions/artifact@6.3.1'
            ]);
            const {DefaultArtifactClient} = await import(pathToFileURL(
              path.join(sdkDirectory, 'node_modules/@actions/artifact/lib/artifact.js')
            ).href);
            const client = new DefaultArtifactClient();
            for (const platform of process.env.SUB2API_BUILD_PLATFORMS.split(/\s+/)) {
              const directory = path.join(process.env.GITHUB_WORKSPACE, 'dist', 'build', platform);
              const suffix = platform.startsWith('windows-') ? '.exe' : '';
              for (const component of ['', 'installer-']) {
                const name = 'sub2api-plugins-' + component + process.env.UPSTREAM_TAG + '-' + platform + suffix;
                await client.uploadArtifact(name, [path.join(directory, name)], directory, {skipArchive: true});
              }
            }
      - uses: actions/cache/save@v6.1.0
        if: ${{ steps.modules.outputs.cache-hit != 'true' }}
        with:
          path: ${{ steps.paths.outputs.modules }}
          key: ${{ steps.modules.outputs.cache-primary-key }}
      - uses: actions/cache/save@v6.1.0
        if: ${{ steps.go_build.outputs.cache-hit != 'true' }}
        with:
          path: ${{ steps.paths.outputs.build }}
          key: ${{ steps.go_build.outputs.cache-primary-key }}
      - uses: actions/cache/save@v6.1.0
        if: ${{ steps.pnpm.outputs.cache-hit != 'true' }}
        with:
          path: ${{ steps.paths.outputs.pnpm }}
          key: ${{ steps.pnpm.outputs.cache-primary-key }}

  release:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
      UPSTREAM_TAG: ${{ needs.build.outputs.tag }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: sub2api-plugins-*
          merge-multiple: true
          path: dist/release
      - name: Create Release
        run: |
          export RELEASE_REF="refs/tags/$RELEASE_TAG"
          encoded_tag="$(jq -rn --arg tag "$RELEASE_TAG" '$tag | @uri')"
          reference="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$encoded_tag" --jq '.[] | select(.ref == env.RELEASE_REF) | [.object.type, .object.sha] | @tsv')"
          if [[ -n "$reference" ]]; then
            read -r type commit <<< "$reference"
            while [[ "$type" == tag ]]; do
              reference="$(gh api "repos/$GH_REPO/git/tags/$commit" --jq '[.object.type, .object.sha] | @tsv')"
              read -r type commit <<< "$reference"
            done
            if [[ "$type" != commit || "$commit" != "$SOURCE_SHA" ]]; then
              echo "::error::The Release tag does not identify the built source commit."
              exit 1
            fi
          fi
          gh release create "$RELEASE_TAG" dist/release/sub2api-plugins-* \
            --target "$SOURCE_SHA" \
            --title "Sub2API-Plugin ${SOURCE_SHA:0:7} (v${UPSTREAM_TAG#v})" \
            --generate-notes
